<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的家鄉-板橋</title>
</head>

<style>
    .banner-content {
        filter: blur(0px);
    }

    .banner-img {
        width: 100%;
        filter: blur(5px);
    }

    .banner {
        text-align: center;
        background-size: cover;
        background-position: center;
        color: white;
    }

    #container {
        /* display: flex;
        flex-direction: column;
        justify-content: center; */
        position: relative;
    }

    #banner,
    #banner-content {
        align-items: center;
        text-align: center;
    }

    .card-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        height: 10rem;
    }

    .card {
        width: 10rem;
        height: 10rem;
        background-color: #835e5e;
        border-radius: 0.5rem;
        box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.25);
        margin: 0.5rem;
    }

    img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }


    .card-img img {
        border-radius: 0.5rem;
    }

    .card-img {
        padding: 0.5rem;
        padding-bottom: 0.25rem;
    }


    .card-content {
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .card-title,
    .card-text {
        margin: 0;
    }
</style>

<body>
    <main id="container">
        <header id="banner">
            <!-- <img class="banner-img" src="assets/view1.jpg" alt="view1"> -->
            <div id="banner-content">
                <h1>板橋</h1>
            </div>
        </header>

        <section id="spots">
            <div class="card-container">
                <div class="card">
                    <div class="card-img">
                        <img src="assets/view1.jpg" alt="view1">
                    </div>
                    <div class="card-content">
                        <p class="card-title">view1</p>
                        <p class="card-text">view1</p>
                    </div>
                </div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
        </section>
    </main>
</body>

</html>
